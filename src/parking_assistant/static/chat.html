<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking Assistant</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb;
          --accent:#2457d6; --user:#e8efff; --ok:#16794c; --warn:#a35b00; --bad:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .facts { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 1fr 340px; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; }
  #chat { display:flex; flex-direction:column; height: calc(100vh - 110px); min-height:420px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--user); }
  .msg.bot { align-self:flex-start; background:#f2f3f5; }
  .sources { margin-top:6px; font-size:12px; color:var(--muted); }
  .sources span { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin:2px 4px 0 0; background:#fff; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 10px; }
  .chips button { background:#fff; color:var(--accent); border:1px solid var(--line); padding:5px 10px; font-size:13px; }
  aside { padding:14px; align-self:start; }
  aside h2 { font-size:15px; margin:0 0 10px; }
  .req { border-top:1px solid var(--line); padding:10px 0; font-size:13px; }
  .badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; color:#fff; }
  .pending { background:var(--warn); } .approved { background:var(--accent); } .rejected { background:var(--bad); } .recorded { background:var(--ok); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Parking Reservation Assistant</h1>
  <div class="facts" id="facts">Loading…</div>
</header>
<main>
  <section class="card" id="chat">
    <div id="log"></div>
    <div class="chips">
      <button type="button" data-q="Where is the parking located?">Location</button>
      <button type="button" data-q="What are the prices?">Prices</button>
      <button type="button" data-q="Are there free spaces?">Availability</button>
      <button type="button" data-q="I want to book a space">Book a space</button>
      <button type="button" data-q="What is the status of my reservation?">My status</button>
    </div>
    <form id="form">
      <input type="text" id="input" autocomplete="off" maxlength="2000" placeholder="Ask about the parking or say “book”…">
      <button id="send">Send</button>
    </form>
  </section>
  <aside class="card">
    <h2>My requests</h2>
    <div id="requests" class="muted">No requests yet.</div>
  </aside>
</main>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');

function addMessage(role, text, sources) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'sources';
    s.append('Sources: ');
    for (const src of sources) {
      const chip = document.createElement('span');
      chip.textContent = src.section ? `${src.title} › ${src.section}` : src.title;
      s.append(chip);
    }
    div.append(s);
  }
  log.append(div);
  log.scrollTop = log.scrollHeight;
}

async function api(path, options) {
  const res = await fetch(path, Object.assign({credentials: 'same-origin'}, options || {}));
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

async function ask(text) {
  if (!text.trim()) return;
  addMessage('user', text);
  input.value = '';
  send.disabled = true;
  try {
    const data = await api('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: text})});
    addMessage('bot', data.reply, data.sources);
    refreshRequests();
  } catch (e) {
    addMessage('bot', 'Sorry, something went wrong: ' + e.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
}

function badge(r) {
  if (r.status === 'approved' && r.export_status === 'recorded') return ['recorded', 'confirmed'];
  return [r.status, r.status];
}

async function refreshRequests() {
  try {
    const data = await api('/api/my-requests');
    const box = document.getElementById('requests');
    if (!data.requests.length) { box.textContent = 'No requests yet.'; box.className = 'muted'; return; }
    box.className = ''; box.replaceChildren();
    for (const r of data.requests) {
      const div = document.createElement('div');
      div.className = 'req';
      const [cls, label] = badge(r);
      const b = document.createElement('span'); b.className = 'badge ' + cls; b.textContent = label;
      const title = document.createElement('div'); title.append(b, ` #${r.id.slice(0, 8)} · ${r.car_number}`);
      const period = document.createElement('div'); period.className = 'muted'; period.textContent = `${r.start.replace('T', ' ')} → ${r.end.replace('T', ' ')}`;
      const status = document.createElement('div'); status.textContent = r.notification || r.status_text;
      div.append(title, period, status);
      box.append(div);
    }
  } catch (e) { /* ignore polling errors */ }
}

async function init() {
  try {
    const f = await api('/api/facility');
    document.getElementById('facts').textContent =
      `${f.name} · ${f.opening_hours} · GEL ${Number(f.hourly_rate_gel).toFixed(2)}/h · ${f.free_spaces_next_hour}/${f.total_spaces} free now · ${f.timezone}`;
  } catch (e) { document.getElementById('facts').textContent = ''; }
  const hist = await api('/api/chat/history').catch(() => ({messages: []}));
  if (hist.messages.length) hist.messages.forEach(m => addMessage(m.role, m.content, m.sources));
  else addMessage('bot', 'Hello! I can answer questions about Demo Central Parking (location, rules, prices, opening hours, free spaces) and help you reserve a space.');
  refreshRequests();
  setInterval(refreshRequests, 5000);
}

document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => ask(b.dataset.q)));
init();
</script>
</body>
</html>
